<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Movie Tracker</h1>
            <p class="subtitle">Keep track of what you want to watch and what you have seen.</p>
        </header>

        <form id="add-form" class="add-form">
            <div class="form-row">
                <input type="text" id="title" placeholder="Movie title" required>
                <input type="text" id="director" placeholder="Director (optional)">
            </div>

            <fieldset class="genre-picker" id="genre-picker">
                <legend>Genres</legend>
            </fieldset>

            <button type="submit">Add to wishlist</button>
        </form>

        <p id="message" class="message" role="status"></p>

        <div class="filters" id="filters">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="false">Want to watch</button>
            <button type="button" data-filter="true">Watched</button>
        </div>

        <div id="movie-list" class="movie-list"></div>

        <section class="stats" id="stats" hidden>
            <h2>Overview</h2>

            <div class="tiles">
                <div class="tile">
                    <span class="tile-value" id="stat-total">0</span>
                    <span class="tile-label">Movies</span>
                </div>
                <div class="tile">
                    <span class="tile-value" id="stat-watched">0</span>
                    <span class="tile-label">Watched</span>
                </div>
                <div class="tile">
                    <span class="tile-value" id="stat-wishlist">0</span>
                    <span class="tile-label">Want to watch</span>
                </div>
                <div class="tile">
                    <span class="tile-value" id="stat-average">&ndash;</span>
                    <span class="tile-label">Average rating</span>
                </div>
            </div>

            <div class="charts">
                <figure class="chart-card">
                    <figcaption>Watched vs want to watch</figcaption>
                    <div class="chart-box">
                        <canvas id="status-chart"></canvas>
                    </div>
                </figure>

                <figure class="chart-card">
                    <figcaption>Movies per genre</figcaption>
                    <div class="chart-box">
                        <canvas id="genre-chart"></canvas>
                    </div>
                </figure>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
